{% extends "base.html" %}
{% block titulo %}Recuperar senha — Fluxo{% endblock %}

{% block corpo %}
<div id="tela-entrar" class="center-screen">
  {% include "_fundo_login.html" %}

  <div class="card login-card">
    <div class="brand">
      <img class="brand-mark" src="{{ url_for('static', filename='favicon.svg') }}" alt="">
      <span class="brand-text">Flu<span>xo</span></span>
    </div>

    {% if mensagem %}
      <p class="aviso aviso-ok texto-intro">{{ mensagem }}</p>
    {% else %}
      <p class="muted texto-intro">Informe o e-mail da sua conta para recuperar o acesso.</p>
      <form method="post" class="texto-intro">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Recuperar senha</button>
      </form>
    {% endif %}

    <p class="dica"><a href="{{ url_for('entrar') }}">Voltar para o login</a></p>
  </div>
</div>
{% endblock %}
